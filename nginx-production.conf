# LJT Paysage - Nginx Configuration (Production with HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name holua.duckdns.org www.holua.duckdns.org;

    root /var/www/ljt-paysage;
    index index.html;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name holua.duckdns.org www.holua.duckdns.org;

    root /var/www/ljt-paysage;
    index index.html;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/holua.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/holua.duckdns.org/privkey.pem;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    # Allow .well-known for Let's Encrypt renewals
    location ^~ /.well-known/ {
        allow all;
    }

    # Cache configuration for static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header ETag '"static"';
    }

    # HTML caching (shorter duration for updates)
    location ~* \.html$ {
        expires 2h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Main location
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Logging
    access_log /var/log/nginx/ljt-paysage-access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/ljt-paysage-error.log warn;
}
