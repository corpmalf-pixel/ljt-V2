# LJT Paysage - Nginx Configuration
# Deploy on holua.duckdns.org with SSL (Certbot)

server {
    listen 80;
    listen [::]:80;
    server_name holua.duckdns.org www.holua.duckdns.org;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name holua.duckdns.org www.holua.duckdns.org;

    # SSL Configuration (generated by Certbot)
    ssl_certificate /etc/letsencrypt/live/holua.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/holua.duckdns.org/privkey.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Root directory
    root /var/www/ljt-paysage;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    # Cache configuration
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header ETag '"static"';
    }

    # HTML caching (shorter duration for updates)
    location ~* \.html$ {
        expires 2h;
        add_header Cache-Control "public, must-revalidate";
    }

    # API requests (if needed in future)
    location /api/ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Main location
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Security: Deny .php, .cgi, etc.
    location ~ \.(php|cgi|pl)$ {
        return 403;
    }

    # Logging
    access_log /var/log/nginx/ljt-paysage-access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/ljt-paysage-error.log warn;

    # Monitoring (optional)
    # location /health {
    #     access_log off;
    #     return 200 "healthy\n";
    #     add_header Content-Type text/plain;
    # }
}

